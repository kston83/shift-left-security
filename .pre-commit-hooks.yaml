# Hooks exported by slsec. Consumers reference this repo in their
# .pre-commit-config.yaml (or run `slsec init` to generate one).

- id: slsec-checkov
  name: slsec checkov (IaC policy)
  description: >-
    Scan staged Terraform and Dockerfiles with checkov using the shared slsec
    baseline policy, and check that inline checkov:skip comments carry a reason.
    OpenTofu .tofu files are reported as not scanned (checkov doesn't read them).
    Warn-only by default; set `mode: block` in .slsec.yaml.
  entry: slsec-checkov
  language: python
  additional_dependencies: ["checkov==3.4.3"]
  # keep in step with HOOK_FILES in slsec/hooks/checkov_hook.py
  files: (\.tf|\.tf\.json|\.tfvars|\.tfvars\.json|\.tofu|\.tofu\.json)$|(^|/)(Dockerfile|Containerfile)([.][^/]*)?$|\.[dD]ockerfile$
  require_serial: true
  # verbose so findings still print in warn mode (when the hook exits 0)
  verbose: true
  stages: [pre-commit, manual]

- id: slsec-sast
  name: slsec SAST (opengrep / Semgrep CE)
  description: >-
    Scan staged source files with the bundled per-language rule packs, using
    opengrep (pinned, SHA-256 verified, cached; works offline after the first
    run) or Semgrep CE (`providers: {sast_engine: semgrep}`). Warn-only by default.
  entry: slsec-sast
  language: python
  # identify tags; keep in step with PACK_EXTENSIONS in slsec/hooks/sast_hook.py
  types_or: [java, kotlin, javascript, jsx, ts, tsx, python, pyi, go, c#]
  require_serial: true
  verbose: true
  stages: [pre-commit, manual]

- id: slsec-osv
  name: slsec osv-scanner (dependency scan, pre-push)
  description: >-
    Scan changed dependency manifests with osv-scanner (OSS, no account needed). Runs only when a manifest or lockfile changed. If the CLI is missing,
    not logged in or offline it warns and lets the push through (CI enforces);
    `strict: true` in .slsec.yaml blocks instead.
  entry: slsec-sca --provider osv
  language: python
  files: (^|/)(package\.json|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|pom\.xml|build\.gradle(\.kts)?|gradle\.lockfile|[^/]*\.versions\.toml|requirements[^/]*\.txt|pyproject\.toml|poetry\.lock|Pipfile\.lock|uv\.lock|go\.mod|go\.sum|[^/]*\.csproj|packages\.lock\.json|Directory\.Packages\.props|packages\.config)$
  require_serial: true
  verbose: true
  stages: [pre-push, manual]

- id: slsec-snyk
  name: slsec Snyk (dependency scan, pre-push)
  description: >-
    Run `snyk test` on changed dependency manifests. Needs SNYK_TOKEN or `snyk auth`. Runs only when a manifest or lockfile changed. If the CLI is missing,
    not logged in or offline it warns and lets the push through (CI enforces);
    `strict: true` in .slsec.yaml blocks instead.
  entry: slsec-sca --provider snyk
  language: python
  files: (^|/)(package\.json|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|pom\.xml|build\.gradle(\.kts)?|gradle\.lockfile|[^/]*\.versions\.toml|requirements[^/]*\.txt|pyproject\.toml|poetry\.lock|Pipfile\.lock|uv\.lock|go\.mod|go\.sum|[^/]*\.csproj|packages\.lock\.json|Directory\.Packages\.props|packages\.config)$
  require_serial: true
  verbose: true
  stages: [pre-push, manual]

- id: slsec-jfrog
  name: slsec JFrog Xray (dependency scan, pre-push)
  description: >-
    Run `jf audit` on changed dependency manifests. Needs a server from `jf c add`. Runs only when a manifest or lockfile changed. If the CLI is missing,
    not logged in or offline it warns and lets the push through (CI enforces);
    `strict: true` in .slsec.yaml blocks instead.
  entry: slsec-sca --provider jfrog
  language: python
  files: (^|/)(package\.json|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|pom\.xml|build\.gradle(\.kts)?|gradle\.lockfile|[^/]*\.versions\.toml|requirements[^/]*\.txt|pyproject\.toml|poetry\.lock|Pipfile\.lock|uv\.lock|go\.mod|go\.sum|[^/]*\.csproj|packages\.lock\.json|Directory\.Packages\.props|packages\.config)$
  require_serial: true
  verbose: true
  stages: [pre-push, manual]
