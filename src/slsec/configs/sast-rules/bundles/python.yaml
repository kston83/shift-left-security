    - patterns:
      - pattern-inside: "def $INSIDE(..., $PARAM, ...):\n  ...\n"
      - pattern-either:
        - pattern: request.$REQFUNC(...)
        - pattern: request.$REQFUNC.get(...)
        - pattern: request.$REQFUNC[...]
  pattern-sinks:
  - pattern-either:
