# slsec gitleaks policy. `slsec init` copies this to .gitleaks.toml in the repo root,
# where gitleaks picks it up automatically.
#
# The default gitleaks ruleset (~200 rules, including Anthropic, OpenAI, AWS,
# GitHub, Slack, JFrog, Snyk ...) is kept. The rules below add coverage for
# secrets pasted into AI coding-agent / MCP server config, which tends to get committed.
#
# Org-specific rules go at the bottom. Re-run `slsec init --update` to refresh
# this file from a newer slsec release (`--force` overwrites it after saving a .bak copy).

title = "slsec gitleaks policy"

[extend]
useDefault = true

[[rules]]
id = "slsec-mcp-config-secret"
description = "Hardcoded secret in an AI agent / MCP server config. Reference an environment variable (\"${MY_TOKEN}\") instead."
path = '''(?i)(^|/)(\.mcp\.json|mcp\.json|mcp_config\.json|claude_desktop_config\.json|\.claude/settings(\.local)?\.json|\.cursor/mcp\.json|\.vscode/mcp\.json|\.gemini/settings\.json)$'''
# The key must END in a whole secret word: API_KEY, GITHUB_PAT, client-secret, apiKey, ghToken.
# Not PATH, TOKEN_FILE, KEY_ID or monkey. Snake/kebab/dotted names match case-insensitively;
# camelCase needs the capital (apiKey, not apikey: that one is covered by the compound list).
regex = '''"(?:(?i:(?:[a-z0-9]+[_.\-])*(?:api|access|auth|bot|bearer|client|private|refresh|secret|session|app)?(?:key|token|secret|password|passwd|pat|credentials?))|[A-Za-z][A-Za-z0-9]*(?:Key|Token|Secret|Password|Passwd|Pat|Credentials?))"\s*:\s*"([^"$\{][^"]{7,})"'''
secretGroup = 1
entropy = 3.0
keywords = ["key", "token", "secret", "passw", "pat", "credential"]

[[rules.allowlists]]
description = "placeholders and env references"
regexTarget = "secret"
regexes = ['''(?i)^(changeme|placeholder|example|redacted|xxxx+|<[^>]+>|your[-_ ].*)$''']

[[rules.allowlists]]
description = "file system paths (a TOKEN_FILE pointing at a file, a PATH list), not secret values"
regexTarget = "secret"
regexes = [
  # POSIX / home-relative paths and colon-separated PATH lists: /opt/homebrew/bin:/usr/bin, ~/secrets/token.txt
  '''^(?:~|\.{1,2})?/[\w.@~\-/]*(?::(?:~|\.{1,2})?/[\w.@~\-/]*)*$''',
  # Windows paths and PATH lists (JSON-escaped in the file): C:\\tools\\bin;C:\\Windows, %USERPROFILE%\\token.txt
  '''^(?:[A-Za-z]:[\\/]|%[A-Za-z_]+%)[^";]*(?:;(?:[A-Za-z]:[\\/]|%[A-Za-z_]+%)[^";]*)*$''',
  # a bare file name with a credential-file extension: token.txt, sa-key.json
  '''^[\w.\-]+\.(?:txt|json|pem|crt|cer|p12|pfx|ya?ml|toml|ini|conf|env)$''',
]

[[rules]]
id = "slsec-mcp-config-auth-header"
description = "Hardcoded Authorization header in an AI agent / MCP server config"
path = '''(?i)(^|/)(\.mcp\.json|mcp\.json|mcp_config\.json|claude_desktop_config\.json|\.claude/settings(\.local)?\.json|\.cursor/mcp\.json|\.vscode/mcp\.json|\.gemini/settings\.json)$'''
regex = '''(?i)"authorization"\s*:\s*"(?:bearer|basic|token)\s+([^"$\{][^"]{11,})"'''
secretGroup = 1
keywords = ["authorization"]

# ---- org-specific rules below ------------------------------------------------
