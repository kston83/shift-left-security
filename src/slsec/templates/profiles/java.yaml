# Profile: java. Java / Kotlin.
# SAST rule packs are chosen by file extension; the engine is set by providers.sast_engine.
# Only cheap hygiene here: builds and linters belong in CI.
repos:
  - repo: SLSEC
    hooks:
      - id: slsec-sast
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-xml # pom.xml and other XML config
