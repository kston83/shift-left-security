# Profile: node. Node.js / JavaScript / TypeScript.
# SAST rule packs are chosen by file extension; the engine is set by providers.sast_engine.
# Only cheap hygiene: lint stays with the project's own tooling. Native security
# plugins (eslint-plugin-security) are deliberately not included.
repos:
  - repo: SLSEC
    hooks:
      - id: slsec-sast
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict # case-only renames break checkouts on Windows/macOS
