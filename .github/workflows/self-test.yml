name: self-test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Semgrep on one leg, so the Semgrep half of the SAST end-to-end test runs too
      # (Opengrep is downloaded and tested on every leg).
      - name: Install Semgrep extra
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m pip install -e ".[semgrep]"
      - name: Test
        env:
          PYTHONFAULTHANDLER: "1" # print every thread's stack if the interpreter crashes
        run: python -m pytest -v

  try-repo:
    name: hooks via pre-commit try-repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pre-commit==4.3.0
      - name: Insecure fixtures warn (exit 0) in default mode
        run: pre-commit try-repo . slsec-checkov --files tests/fixtures/terraform/insecure/main.tf tests/fixtures/docker/insecure/Dockerfile
      - name: Insecure fixtures block in block mode
        run: |
          if SLSEC_MODE=block pre-commit try-repo . slsec-checkov --files tests/fixtures/terraform/insecure/main.tf; then
            echo "expected block mode to fail"; exit 1
          fi
      - name: Secure fixtures pass in block mode
        run: SLSEC_MODE=block pre-commit try-repo . slsec-checkov --files tests/fixtures/terraform/secure/main.tf tests/fixtures/docker/secure/Dockerfile

      - name: slsec-sast warns on insecure code (exit 0) in default mode
        run: pre-commit try-repo . slsec-sast --files tests/fixtures/python/insecure.py tests/fixtures/java/Insecure.java
      - name: slsec-sast blocks insecure code in block mode
        run: |
          if SLSEC_MODE=block pre-commit try-repo . slsec-sast --files tests/fixtures/python/insecure.py; then
            echo "expected block mode to fail"; exit 1
          fi
      - name: slsec-sast passes secure code in block mode
        run: SLSEC_MODE=block SLSEC_STRICT=1 pre-commit try-repo . slsec-sast --files tests/fixtures/python/secure.py tests/fixtures/java/Secure.java

      - name: slsec-osv warns on a vulnerable manifest (exit 0) in default mode
        run: pre-commit try-repo . slsec-osv --hook-stage pre-push --files tests/fixtures/sca/python/requirements.txt
      - name: slsec-osv blocks a vulnerable manifest in block mode
        run: |
          if SLSEC_MODE=block pre-commit try-repo . slsec-osv --hook-stage pre-push --files tests/fixtures/sca/python/requirements.txt; then
            echo "expected block mode to fail"; exit 1
          fi

      # No Snyk/JFrog CLI or credentials here: they must warn and pass, unless strict.
      - name: Unavailable Snyk/JFrog warn without strict
        run: SLSEC_STRICT=0 pre-commit try-repo . slsec-snyk --hook-stage pre-push --files tests/fixtures/sca/node/package.json
      - name: Unavailable Snyk/JFrog fail with SLSEC_STRICT=1
        run: |
          for hook in slsec-snyk slsec-jfrog; do
            if SLSEC_STRICT=1 pre-commit try-repo . "$hook" --hook-stage pre-push --files tests/fixtures/sca/node/package.json; then
              echo "expected $hook to fail in strict mode"; exit 1
            fi
          done

  dogfood:
    name: this repo's own hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pre-commit==4.3.0
      - run: pre-commit run --all-files --show-diff-on-failure
