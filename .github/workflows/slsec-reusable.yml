# Reusable workflow: run the slsec checks in CI so `git commit --no-verify` is not a bypass.
#
# Consumer usage (.github/workflows/security.yml):
#
#   on: [push, pull_request]
#   permissions: {}
#   jobs:
#     slsec:
#       uses: kston83/shift-left-security/.github/workflows/slsec-reusable.yml@v0.3.0
#       permissions:
#         contents: read
#         security-events: write   # SARIF -> code scanning (needs GHAS on private repos)
#       # Optional provider secrets: pass only what you use (no `secrets: inherit`).
#       secrets:
#         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
#
# Optional SonarQube analysis + quality gate: set `sonarqube: true` and pass
# SONAR_TOKEN / SONAR_HOST_URL. See docs/ci.md and docs/providers.md.
#
name: slsec

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.14"
      pre-commit-version:
        type: string
        default: "4.3.0"
      gitleaks-image:
        description: gitleaks container image for the full-history scan, pinned by digest
        type: string
        default: "zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
      gitleaks-version:
        description: "Deprecated: use gitleaks-image. If set, runs zricethezav/gitleaks:v<version> (tag only, not digest-pinned)"
        type: string
        default: ""
      slsec-version:
        description: slsec release whose `slsec doctor --ci` gates the run (installed from slsec-source at tag v<version>)
        type: string
        default: "0.3.0"
      slsec-source:
        description: git URL of the slsec repo (an internal mirror, for example)
        type: string
        default: "https://github.com/kston83/shift-left-security"
      enforce-setup:
        description: >-
          Fail when `slsec doctor --ci` finds the setup weakened: a required hook missing or switched
          off, a placeholder exception reason, or a mode/profile requirement below not met
        type: boolean
        default: true
      require-mode:
        description: "Fail unless .slsec.yaml sets this mode (warn | block). Empty: no requirement"
        type: string
        default: ""
      require-profiles:
        description: >-
          Comma-separated profiles whose hooks must be present whatever .slsec.yaml says, for
          example "terraform,python". Empty: the profiles recorded in .slsec.yaml
        type: string
        default: ""
      trusted-repos:
        description: >-
          Comma-separated extra hook repo URLs the setup gate accepts for required hooks (internal
          mirrors of gitleaks, pre-commit-hooks and so on). slsec's own hooks must come from slsec-source
        type: string
        default: ""
      upload-sarif:
        description: Upload SARIF to GitHub code scanning (requires GHAS for private repos)
        type: boolean
        default: true
      fail-on-findings:
        description: Fail the job when hooks fail (false = report only, for rollout)
        type: boolean
        default: true
      strict:
        description: >-
          Fail when a scanner can't run (missing CLI or credentials, timeout, broken rules) instead of
          warning. Sets SLSEC_STRICT for the hooks, overriding `strict:` in .slsec.yaml.
        type: boolean
        default: true
      install-jfrog-cli:
        description: Install the JFrog CLI (jf) for the slsec-jfrog hook, configured from the JF_URL and JF_ACCESS_TOKEN secrets
        type: boolean
        default: false
      sonarqube:
        description: Run SonarQube analysis and wait for the quality gate (needs SONAR_TOKEN and SONAR_HOST_URL)
        type: boolean
        default: false
      sonar-args:
        description: "Extra scanner arguments, for example -Dsonar.projectKey=my-project -Dsonar.sources=src"
        type: string
        default: ""
      sonar-project-base-dir:
        description: Directory the Sonar scan runs from (sonar.projectBaseDir)
        type: string
        default: "."
    secrets:
      SNYK_TOKEN:
        description: Snyk API or service-account token for the slsec-snyk hook (pre-push stage)
        required: false
      JF_URL:
        description: JFrog Platform URL for the slsec-jfrog hook
        required: false
      JF_ACCESS_TOKEN:
        description: JFrog access token for the slsec-jfrog hook
        required: false
      SONAR_TOKEN:
        description: SonarQube token (only used when sonarqube is true)
        required: false
      SONAR_HOST_URL:
        description: SonarQube server URL (only used when sonarqube is true)
        required: false

permissions: {}

jobs:
  slsec:
    name: shift-left security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SLSEC_REPORT_DIR: ${{ github.workspace }}/slsec-reports
      SLSEC_CI: "1"
      SLSEC_STRICT: ${{ inputs.strict && '1' || '0' }}
      # One id for every hook invocation in this job: pre-commit splits long file lists into
      # several runs of a hook, and the reports from all of them add up instead of overwriting.
      SLSEC_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the gitleaks scan
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: slsec-pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        env:
          PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
        run: python -m pip install --disable-pip-version-check "pre-commit==${PRE_COMMIT_VERSION}"

      # The PR controls .pre-commit-config.yaml and .slsec.yaml, so check them against policy that
      # lives here (the slsec release and this job's inputs) before trusting the hook results.
      - name: slsec doctor (setup gate)
        id: doctor
        env:
          SLSEC_VERSION: ${{ inputs.slsec-version }}
          SLSEC_SOURCE: ${{ inputs.slsec-source }}
          REQUIRE_MODE: ${{ inputs.require-mode }}
          REQUIRE_PROFILES: ${{ inputs.require-profiles }}
          TRUSTED_REPOS: ${{ inputs.trusted-repos }}
        run: |
          set +e
          case "$SLSEC_VERSION" in
            *[!0-9.]*|"") echo "::error title=slsec::slsec-version must look like 1.2.3"; echo "rc=2" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! python -m venv "$RUNNER_TEMP/slsec-venv" ||
             ! "$RUNNER_TEMP/slsec-venv/bin/pip" install --quiet --disable-pip-version-check \
               "slsec @ git+${SLSEC_SOURCE}@v${SLSEC_VERSION}"; then
            echo "::error title=slsec::could not install slsec v${SLSEC_VERSION} from ${SLSEC_SOURCE}"
            echo "rc=2" >> "$GITHUB_OUTPUT"; exit 0
          fi
          args=(doctor --ci --source-url "$SLSEC_SOURCE")
          [ -n "$TRUSTED_REPOS" ] && args+=(--trusted-repos "$TRUSTED_REPOS")
          [ -n "$REQUIRE_MODE" ] && args+=(--require-mode "$REQUIRE_MODE")
          [ -n "$REQUIRE_PROFILES" ] && args+=(--require-profiles "$REQUIRE_PROFILES")
          "$RUNNER_TEMP/slsec-venv/bin/slsec" "${args[@]}"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Install JFrog CLI
        if: inputs.install-jfrog-cli
        uses: jfrog/setup-jfrog-cli@6ed45ef1a24199bd4c94d3fd55a7e8cb7e45985d # v5.3.2
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        with:
          disable-auto-build-publish: true

      # Commit-stage hooks need no credentials, so no secrets are exposed to them.
      - name: Run slsec hooks (commit stage)
        id: hooks
        run: |
          mkdir -p "$SLSEC_REPORT_DIR"
          set +e
          pre-commit run --all-files --show-diff-on-failure --color=always --hook-stage pre-commit
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # The pre-push stage is SCA (osv-scanner, Snyk, JFrog). With --all-files every manifest
      # is scanned. With `strict` on (the default) a configured provider with no credentials
      # fails this step; set `strict: false` to only warn while you roll out tokens.
      - name: Run slsec hooks (pre-push stage, SCA)
        id: prepush
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          set +e
          pre-commit run --all-files --show-diff-on-failure --color=always --hook-stage pre-push
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: gitleaks (full git history)
        id: gitleaks
        env:
          GITLEAKS_IMAGE: ${{ inputs.gitleaks-image }}
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set +e
          image="$GITLEAKS_IMAGE"
          if [ -n "$GITLEAKS_VERSION" ]; then
            echo "::warning title=slsec::gitleaks-version is deprecated and not digest-pinned; use gitleaks-image"
            image="zricethezav/gitleaks:v${GITLEAKS_VERSION}"
          fi
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            "$image" \
            git /repo --redact --no-banner \
            --report-format sarif --report-path /repo/slsec-reports/gitleaks.sarif
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF (checkov terraform)
        if: always() && inputs.upload-sarif && hashFiles('slsec-reports/checkov-terraform.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: slsec-reports/checkov-terraform.sarif
          category: slsec-checkov-terraform

      - name: Upload SARIF (checkov dockerfile)
        if: always() && inputs.upload-sarif && hashFiles('slsec-reports/checkov-dockerfile.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: slsec-reports/checkov-dockerfile.sarif
          category: slsec-checkov-dockerfile

      - name: Upload SARIF (SAST)
        if: always() && inputs.upload-sarif && hashFiles('slsec-reports/slsec-sast.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: slsec-reports/slsec-sast.sarif
          category: slsec-sast

      - name: Upload SARIF (osv-scanner)
        if: always() && inputs.upload-sarif && hashFiles('slsec-reports/slsec-osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: slsec-reports/slsec-osv.sarif
          category: slsec-osv

      - name: Upload SARIF (Snyk)
        if: always() && inputs.upload-sarif && hashFiles('slsec-reports/slsec-snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: slsec-reports/slsec-snyk.sarif
          category: slsec-snyk

      - name: Upload SARIF (JFrog)
        if: always() && inputs.upload-sarif && hashFiles('slsec-reports/slsec-jfrog.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: slsec-reports/slsec-jfrog.sarif
          category: slsec-jfrog

      - name: Upload SARIF (gitleaks)
        if: always() && inputs.upload-sarif && hashFiles('slsec-reports/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: slsec-reports/gitleaks.sarif
          category: slsec-gitleaks

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slsec-reports
          path: slsec-reports/
          if-no-files-found: ignore

      - name: Enforce results
        if: always()
        env:
          HOOKS_RC: ${{ steps.hooks.outputs.rc }}
          PREPUSH_RC: ${{ steps.prepush.outputs.rc }}
          GITLEAKS_RC: ${{ steps.gitleaks.outputs.rc }}
          DOCTOR_RC: ${{ steps.doctor.outputs.rc }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
          ENFORCE_SETUP: ${{ inputs.enforce-setup }}
        run: |
          status=0
          if [ "${DOCTOR_RC:-2}" != "0" ]; then
            if [ "$ENFORCE_SETUP" = "true" ]; then
              echo "::error title=slsec::the slsec setup check failed (required hook missing or disabled, weak exception reason, or mode/profile requirement); see the 'slsec doctor' step"
              status=1
            else
              echo "::warning title=slsec::the slsec setup check failed; see the 'slsec doctor' step (enforce-setup is off)"
            fi
          fi
          if [ "${GITLEAKS_RC:-0}" = "1" ]; then
            echo "::error title=slsec::gitleaks found secrets in git history. Rotate them first, then clean up or allowlist."
            status=1
          elif [ "${GITLEAKS_RC:-0}" != "0" ]; then
            echo "::warning title=slsec::gitleaks could not run (exit ${GITLEAKS_RC}); secrets were NOT scanned"
          fi
          if [ "${HOOKS_RC:-0}" != "0" ] || [ "${PREPUSH_RC:-0}" != "0" ]; then
            if [ "$FAIL_ON_FINDINGS" = "true" ]; then
              echo "::error title=slsec::security hooks failed; see the 'Run slsec hooks' steps"
              status=1
            else
              echo "::warning title=slsec::security hooks failed (report-only mode)"
            fi
          fi
          exit "$status"

  sonarqube:
    name: SonarQube analysis + quality gate
    if: inputs.sonarqube
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history gives Sonar accurate blame and new-code detection
          persist-credentials: false

      # The CLI scanner action suits JS/TS, Python, Go, PHP, Ruby, IaC and similar.
      # Java (Maven/Gradle) and .NET need their build-integrated scanners instead
      # (`mvn sonar:sonar`, `./gradlew sonar`, dotnet-sonarscanner): see docs/ci.md.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: ${{ inputs.sonar-project-base-dir }}
          args: ${{ inputs.sonar-args }}

      - name: SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        continue-on-error: ${{ !inputs.fail-on-findings }}
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
